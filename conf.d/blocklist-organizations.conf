# Blacklisted organizations - IPs from these orgs/ISPs are always banned, even from whitelisted countries
# Comma-separated, case-insensitive (matches org/isp from ip-api.com)
# Examples: Microsoft, DigitalOcean, Amazon, Oracle, OVH
# Leave empty to disable
BLOCKED_ORGANIZATIONS=

# Multi-domain abuse: if IP from a whitelisted country has recent non-CMS
# (scanner) hits on this many domains, ban anyway. WordPress admin/editor
# traffic is not counted. Set to 0 to disable. Recommended: 3–5
MULTI_DOMAIN_ABUSE_THRESHOLD=3
