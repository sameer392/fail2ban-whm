# CMS / editor path allow list for apache-high-volume
# Managed in WHM → Fail2Ban Manager → Whitelists → CMS / Editor paths
#
# Format (TAB-separated):
#   name<TAB>pattern<TAB>countries<TAB>enabled
# pattern is matched against the request log line (URI). Use a substring or regex.
# countries: comma-separated ISO 3166-1 alpha-2 codes (e.g. IN,US). Empty = all countries.
# enabled: 1 or 0
#
# These paths are NOT ignored globally. Only IPs from the listed countries are
# treated as legitimate editors (fail2ban ignorecommand + multi-domain check).
#
WordPress admin	wp-admin	IN	1
WordPress includes	wp-includes	IN	1
WordPress content	wp-content/	IN	1
WordPress REST API	wp-json/	IN	1
admin-ajax	admin-ajax.php	IN	1
wp-cron	wp-cron.php	IN	1
load-styles	load-styles.php	IN	1
load-scripts	load-scripts.php	IN	1
Static files	\.(css|js|mjs|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|mp4|webm|avif)(\?|[[:space:]])	IN	1
