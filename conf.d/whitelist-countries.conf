# Whitelisted countries (never banned) - ISO 3166-1 alpha-2 codes, comma-separated
# Example: IN = India, US = United States
# Leave empty to ban all countries
WHITELIST_COUNTRIES=IN

# What to do when an IP is not in the local IP2Location database (no network lookup is made):
#   ban  (default) - treat as not whitelisted, so it can be banned
#   skip           - exempt it from banning
UNKNOWN_COUNTRY_ACTION=ban
