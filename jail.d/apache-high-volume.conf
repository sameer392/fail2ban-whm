# Fail2Ban jail for high-volume traffic blocking
# Counts non-CMS requests only (see filter ignoreregex). Scrapers still banned.
# WordPress admin / Elementor / static assets are ignored so site owners are not blocked.

[apache-high-volume]
enabled = true
port = http,https
filter = apache-high-volume

# Use file polling (not systemd journal) - required for domlogs
backend = polling

logpath = /usr/local/apache/domlogs/*/*

# Ban after 100 requests within 10 minutes
maxretry = 100
findtime = 600
bantime = 3600

# Use CSF for banning (persists across fail2ban restarts)
# Comment in csf.deny: "Fail2Ban apache-high-volume - domain.com"
banaction = csf-domain
banaction_allports = csf-domain
