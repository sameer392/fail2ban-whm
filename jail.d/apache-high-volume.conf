# Fail2Ban jail for high-volume traffic blocking
# CMS/editor paths are allowed per country via conf.d/cms-allow.conf
# (WHM → Whitelists → CMS / Editor paths), not ignored globally.

[apache-high-volume]
enabled = true
port = http,https
filter = apache-high-volume

# Use file polling (not systemd journal) - required for domlogs
backend = polling

logpath = /usr/local/apache/domlogs/*/*

# Ban after 100 requests within 10 minutes
maxretry = 100
findtime = 600
bantime = 3600

# Skip counting when IP is a CMS editor from an allowed country (cms-allow.conf).
# ignorecache avoids running the script on every log line (fail2ban calls it per match).
ignorecommand = timeout 4 /etc/fail2ban/scripts/cms-allow.sh <ip>
ignorecache = key="<ip>", max-count=20000, max-time=1m

# Use CSF for banning (persists across fail2ban restarts)
# Comment in csf.deny: "Fail2Ban apache-high-volume - domain.com"
banaction = csf-domain
banaction_allports = csf-domain
