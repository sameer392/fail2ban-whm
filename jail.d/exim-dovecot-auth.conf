# Brute-force protection for mail logins (SMTP AUTH, IMAP, POP3) via Exim + Dovecot.
# Reads /var/log/exim_mainlog, where Exim records Dovecot authentication failures.
# Bans are per source IP: 5 failures within 10 minutes -> banned for 1 hour.
# The server's own addresses are never banned (fail2ban ignoreself, default on).
# To exempt a trusted IP, add it to ignoreip below. Note: update-whitelist.sh does NOT apply to this jail.
[exim-dovecot-auth]
enabled  = true
filter   = exim-dovecot-auth
logpath  = /var/log/exim_mainlog
backend  = auto
usedns   = no
port     = smtp,ssmtp,submission,imap,imaps,pop3,pop3s
maxretry = 5
findtime = 600
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1
