# Override 00-systemd.conf for cPanel/LiteSpeed domlog jails.
# systemd journal does not contain those access logs.
# pyinotify is event-driven; polling every second across 1000+ logs
# per jail was the main fail2ban CPU cost.
#
# This file sorts after apache-*.conf so it wins even if a generator
# still writes backend = polling.

[apache-high-volume]
backend = pyinotify
usedns = no

[wordpress-wp-login]
backend = pyinotify
usedns = no

[apache-ua-keywords]
backend = pyinotify
usedns = no
