# Fail2Ban filter: combined User-Agent keyword rules
# Generated by update-useragent-jails.sh (single jail to cut log watches)
# Darwin is omitted: it matches every iOS/macOS User-Agent and bans real visitors.

[Definition]
failregex = ^<HOST> - .* ".*" [0-9]+ [0-9]+ ".*" "-"$
            ^<HOST> - .* ".*" [0-9]+ [0-9]+ ".*" "(?i).*python.*"
            ^<HOST> - .* ".*" [0-9]+ [0-9]+ ".*" "(?i).*headless.*"
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
