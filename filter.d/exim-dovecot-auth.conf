# Dovecot SASL auth failures logged by Exim (exim_mainlog)
# Example line:
#   2026-11-25 21:43:36 dovecot_login authenticator failed for H=(host) [1.2.3.4]:56826: 535 Incorrect authentication data (set_id=user@example.com)
# fail2ban strips the timestamp before matching, so the regex starts at the authenticator name.
# The trailing "[<HOST>]:port:" is the real client IP (the H= field may contain a reverse-DNS name in parentheses).

[Definition]
failregex = dovecot_\w+ authenticator failed for .*\[<HOST>\]:\d+: 535
ignoreregex =
