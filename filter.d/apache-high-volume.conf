# Fail2Ban filter for high-volume traffic (scrapers / floods)
# Matches requests in Apache/LiteSpeed combined log format (cPanel domlogs)
#
# WordPress editors are excluded: wp-admin, REST API, plugin/theme assets, and
# static files generate hundreds of requests per page and are not abuse.

[Definition]
# Match any request - captures IP for counting
# Combined log: IP - - [date] "METHOD /path HTTP/x.x" ...
failregex = ^<HOST> - .*

# Exclude known crawlers, server IPs, and legitimate CMS/static traffic.
# Whitelist IPs: run update-whitelist.sh after editing whitelist-ips.conf
# Crawlers: Google, Bing, Facebook. CMS paths are always ignored (kept by update-whitelist.sh).
ignoreregex = ^66\.249\.|^2a03:2880|^173\.208\.207\.|^40\.77\.|^207\.46\.|googlebot|bingbot|meta-webindexer|facebookexternalhit|^173\.208\.207\.(168|169|170|171|172|173|174|175)|^173\.208\.157\.(32|33|34|35|36|37|38|39)|^204\.12\.247\.(40|41|42|43|44|45|46|47)|wp-admin|wp-includes|wp-content/|wp-json/|admin-ajax\.php|wp-cron\.php|load-styles\.php|load-scripts\.php|\.(css|js|mjs|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|mp4|webm|avif)(\?|\s)
